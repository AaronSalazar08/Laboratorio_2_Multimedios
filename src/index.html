<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>La Sede Te Acompaña - UCR</title>
    <link rel="stylesheet" href="index.css">
</head>
<body>

    <nav class="side-nav">
        <a href="aulas.html" class="btn-nav">Ver Aulas</a>
    </nav>

    <main class="poster-container">
        <header class="poster-header">
            <div class="badge badge-blue">LA SEDE</div>
            <div class="badge badge-white">TE</div>
            <div class="badge badge-purple">ACOMPAÑA</div>
        </header>

        <section class="poster-content">
            <h1 class="main-title">El respeto no se negocia</h1>
            <h2 class="sub-title">¡Pará ya de acosar!</h2>
            
            <div class="qr-section">
                <p>Si necesitás ayuda, escaneá este QR:</p>
                <div class="qr-placeholder">
                    <img src="qr.png" alt="Código QR de ayuda">
                </div>
            </div>
        </section>

        <section class="poster-visual">
            <img src="altov1.png" alt="Estudiantes de la UCR" class="student-photo">
        </section>

        <footer class="poster-footer">
            <div class="logo-group">
                <img src="logoucr.png" alt="UCR Logo" class="logo-main">
                <div class="divider"></div>
                <div class="logo-text">UCR LIBRE DE ACOSO SEXUAL</div>
                <div class="divider"></div>
                <div class="logo-sub">
                    <strong>SG</strong> Sede de Guanacaste
                </div>
            </div>
        </footer>
    </main>

</body>
</html>
